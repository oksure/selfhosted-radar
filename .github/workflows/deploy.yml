name: Deploy to PocketHost

on:
  push:
    branches: [main]
    paths:
      - 'pb_public/**'
      - 'pb_hooks/**'
      - 'pb_migrations/**'
      - '.github/deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        instance: [selfhosted]
    concurrency:
      group: pockethost-${{ matrix.instance }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official CLI
        env:
          POCKETHOST_VERSION: 5.0.0-alpha.10
        run: |
          set -euo pipefail
          asset="pockethost_${POCKETHOST_VERSION}_linux_amd64.zip"
          base="https://github.com/pockethost/pockethost/releases/download/v${POCKETHOST_VERSION}"
          curl -sSLo "$RUNNER_TEMP/$asset" "$base/$asset"
          curl -sSLo "$RUNNER_TEMP/checksums.txt" "$base/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${asset}\$" checksums.txt | sha256sum -c -)
          unzip -o -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/phcli"
          install -m 0755 "$RUNNER_TEMP/phcli/pockethost" /usr/local/bin/pockethost
          pockethost version
      - name: Test deployment guard
        run: sudo env PATH="$PATH" unshare --net python3 -B -m unittest discover -s .github/deploy -p 'test_*.py' -v
      - name: Deploy code folders
        env:
          POCKETHOST_TOKEN: ${{ secrets.POCKETHOST_TOKEN }}
          PH_EMAIL: ${{ secrets.PH_EMAIL }}
          PH_PASSWORD: ${{ secrets.PH_PASSWORD }}
        run: python3 .github/deploy/deploy-code.py "${{ matrix.instance }}" "."
