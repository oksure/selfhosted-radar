name: Deploy to PocketHost

on:
  push:
    branches: [main]
    paths:
      - 'pb_public/**'
      - 'pb_hooks/**'
      - 'pb_migrations/**'
      - '.github/deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        instance: [selfhosted]
    concurrency:
      group: pockethost-${{ matrix.instance }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official CLI
        run: npm install --global pockethost@4.3.0
      - name: Test deployment guard
        run: sudo unshare --net python3 -B -m unittest discover -s .github/deploy -p 'test_*.py' -v
      - name: Deploy code folders
        env:
          POCKETHOST_TOKEN: ${{ secrets.POCKETHOST_TOKEN }}
        run: python3 .github/deploy/deploy-code.py "${{ matrix.instance }}" "."
